name: Template checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm audit --omit=dev --prefix backend
      - run: npm run test:privacy
      - run: python scripts/check-architecture.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend -- --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static-build
          path: frontend/dist
