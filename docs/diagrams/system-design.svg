<text x="810" y="208.92" font-size="13" font-weight="400" text-anchor="start" fill="#526174">API and worker share the queue processor. MongoDB stores the outbox; there is no separate message broker.</text>
<text x="60" y="1407.6" font-size="15" font-weight="700" text-anchor="start" fill="#142438">Notation</text>
<text x="240" y="1407.26" font-size="14" font-weight="400" text-anchor="start" fill="#526174">Blue solid: synchronous request · Teal solid: database I/O (both ways) · Grey dashed: payment webhook / email delivery</text>
<text x="60" y="1447.26" font-size="14" font-weight="400" text-anchor="start" fill="#526174">Trust: browser payment callbacks do not settle a registration; the API verifies order, amount, currency, signature and capture.</text>
<text x="60" y="1480.26" font-size="14" font-weight="400" text-anchor="start" fill="#526174">Deployment: API runtime + worker/scheduler + MongoDB replica set. Host the reference frontend only when needed; no cloud vendor is required.</text>
