<text x="550" y="1161" font-size="15" fill="#14233b">Manual refund evidence</text>
<text x="60" y="1284" font-size="15" fill="#52627a">Payment settlement and email enqueue are transactional. A callback or webhook replay must not duplicate passes or mail.</text>
<text x="60" y="1324" font-size="15" fill="#52627a">Request-time mail delivery is best effort; a separately scheduled worker retries persisted jobs after failures.</text>
<text x="60" y="1364" font-size="15" fill="#52627a">Optional manual payment/document review remains available. No real payment credentials or participant data ship with this template.</text>
