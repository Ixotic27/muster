<text x="60" y="1162" font-size="16" font-weight="700" text-anchor="start" fill="#203044">CHEN NOTATION</text>
<text x="60" y="1200" font-size="16" font-weight="400" text-anchor="start" fill="#203044">Rectangle = entity   Diamond = relationship   Oval = attribute   Underlined attribute = primary identifier</text>
<text x="60" y="1231" font-size="16" font-weight="400" text-anchor="start" fill="#203044">Single line = partial (optional) participation; double line = total (required) participation.</text>
<text x="60" y="1262" font-size="16" font-weight="400" text-anchor="start" fill="#203044">(min,max) at an entity end counts its participation in that relationship. N means many; these are not flow arrows.</text>
<text x="60" y="1298" font-size="15" font-weight="400" text-anchor="start" fill="#556577">Solo registrations have no Team. Each Pass belongs to one person; (registrationId, userId) is unique. Free entries need no Payment.</text>
<text x="60" y="1330" font-size="15" font-weight="400" text-anchor="start" fill="#556577">Registration has receipt history, not a mandatory 1:1 payment. Technical gateway, invitations, outbox and embedded membership are in the physical views.</text>
</g></svg>