<text x="1400" y="1178" font-size="15" fill="#14233b">No live data in repository</text>
<text x="60" y="1294" font-size="15" fill="#52627a">PK = primary identifier. Arrow labels describe logical cardinality; this diagram highlights the main workflow references.</text>
<text x="60" y="1334" font-size="15" fill="#52627a">Each accepted teammate receives a separate pass. Scan state belongs to that pass; payment belongs to the registration.</text>
<text x="60" y="1374" font-size="15" fill="#52627a">Refunds are review fields on Registration. Capacity and roster snapshots preserve historical decisions.</text>
